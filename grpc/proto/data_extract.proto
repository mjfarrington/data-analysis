syntax = "proto3";

package dataextract.v1;

// ─────────────────────────────────────────────────────────────────────────────
// Data Extract Service
// Provides data extraction by application ID and date, in segments.
// ─────────────────────────────────────────────────────────────────────────────
service DataExtractService {
  // Stream data chunks for a given application + date + segment
  rpc ExtractData (ExtractRequest) returns (stream DataChunk);

  // Extract all segments for a given application + date (auto-paging)
  rpc ExtractAllSegments (ExtractAllRequest) returns (stream DataChunk);

  // Ping / health check
  rpc TestConnection (Empty) returns (ConnectionStatus);

  // Service performance metrics
  rpc GetServiceStatus (Empty) returns (ServiceStatus);

  // List available application IDs and date ranges
  rpc ListAvailableData (ListRequest) returns (ListResponse);
}

// ─────────────────────────────────────────────────────────────────────────────
// Messages
// ─────────────────────────────────────────────────────────────────────────────

message Empty {}

message ExtractRequest {
  string application_id = 1;   // e.g. "APP001"
  string date            = 2;  // ISO-8601: "YYYY-MM-DD"
  int32  segment         = 3;  // 0-based segment index
  int32  page_size       = 4;  // records per chunk (default 10 000)
}

message ExtractAllRequest {
  string application_id = 1;
  string date            = 2;
  int32  page_size       = 3;
}

message DataChunk {
  string application_id  = 1;
  string date            = 2;
  int32  segment         = 3;
  int32  total_segments  = 4;
  bool   is_last         = 5;
  int64  total_records   = 6;  // total across all segments
  int64  segment_records = 7;  // records in this segment
  repeated Record records = 8;
  ChunkMetadata metadata  = 9;
}

message Record {
  string id              = 1;
  string application_id  = 2;
  string date            = 3;
  int32  segment         = 4;
  string entity_type     = 5;
  string entity_id       = 6;
  string status          = 7;
  double value           = 8;
  string currency        = 9;
  string category        = 10;
  string region          = 11;
  string created_at      = 12;
  string updated_at      = 13;
  map<string, string> attributes = 14;
}

message ChunkMetadata {
  string extract_id      = 1;  // unique ID for this extraction run
  string server_version  = 2;
  int64  timestamp_ms    = 3;
  double latency_ms      = 4;
}

message ConnectionStatus {
  bool   connected       = 1;
  string message         = 2;
  string server_version  = 3;
  string server_id       = 4;
  int64  uptime_seconds  = 5;
}

message ServiceStatus {
  bool   healthy                = 1;
  int32  active_connections     = 2;
  int64  total_records_served   = 3;
  int64  total_extractions      = 4;
  double avg_response_time_ms   = 5;
  double records_per_second     = 6;
  string server_version         = 7;
  repeated AppDataInfo available_apps = 8;
}

message AppDataInfo {
  string application_id  = 1;
  string earliest_date   = 2;
  string latest_date     = 3;
  int64  total_records   = 4;
  int32  segment_count   = 5;
}

message ListRequest {
  string application_id = 1;  // optional filter
  string from_date      = 2;  // optional
  string to_date        = 3;  // optional
}

message ListResponse {
  repeated AppDataInfo apps = 1;
}
