# =============================================================================
# Spark configuration — tracked in git.
# Variables like PROJECT_DIR and SPARK_HOME are substituted by spark-manager.sh at startup.
# Do NOT hardcode absolute paths here.
# =============================================================================

spark.master                          spark://localhost:7077
spark.eventLog.enabled                true
spark.eventLog.dir                    file://${PROJECT_DIR}/data/spark/events
spark.history.fs.logDirectory         file://${PROJECT_DIR}/data/spark/events
spark.sql.warehouse.dir               ${PROJECT_DIR}/data/spark/warehouse

# Hive catalog — shared by Connect and ThriftServer via Derby NetworkServer
spark.sql.catalogImplementation         hive

# Derby metastore via standalone Derby NetworkServer (scripts/startNetworkServer).
# Keep PROJECT_DIR placeholder so spark-manager.sh writes an absolute path.
spark.hadoop.javax.jdo.option.ConnectionURL  jdbc:derby://localhost:1527/${PROJECT_DIR}/data/spark/metastore_db;create=true
spark.hadoop.javax.jdo.option.ConnectionDriverName  org.apache.derby.jdbc.ClientDriver
spark.hadoop.datanucleus.schema.autoCreateAll  true
spark.driver.extraClassPath          ${PROJECT_DIR}/tools/derby/lib/derbyclient.jar
spark.executor.extraClassPath        ${PROJECT_DIR}/tools/derby/lib/derbyclient.jar
spark.driver.extraJavaOptions         -Dlog4j.configurationFile=${SPARK_HOME}/conf/log4j2.properties -Dderby.stream.error.file=${PROJECT_DIR}/var/logs/derby/derby-client.log
spark.executor.extraJavaOptions       -Dlog4j.configurationFile=${SPARK_HOME}/conf/log4j2.properties -Dderby.stream.error.file=${PROJECT_DIR}/var/logs/derby/derby-client.log

# Spark Connect
spark.connect.grpc.binding.port       15002

# Resource limits — prevent any single app from consuming all cores
spark.cores.max                       4
spark.executor.cores                  2
spark.driver.cores                    1
spark.driver.memory                   1g
spark.executor.memory                 2g

# Performance tuning
spark.sql.adaptive.enabled            true
spark.sql.adaptive.coalescePartitions.enabled  true
spark.sql.files.maxRecordsPerFile     1000000
spark.sql.parquet.compression.codec   snappy
spark.serializer                      org.apache.spark.serializer.KryoSerializer

# Thrift Server
spark.sql.hive.thriftServer.async     true
